# Builds the PennyWise Android app (APK) on GitHub's free servers and
# publishes it as a Release you can download straight to your phone.
# Runs automatically every time you upload/change files, or manually from
# the Actions tab ("Run workflow")..
name: Build PennyWise APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android platform files
        run: |
          flutter create --org com.pennywise --project-name pennywise --platforms android .
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="PennyWise"/' "$M"
          # Internet is used ONLY for the optional "check for updates" feature;
          # the https query lets the app open the download link in a browser.
          if ! grep -q 'android.permission.INTERNET' "$M"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <queries>\n        <intent>\n            <action android:name="android.intent.action.VIEW"/>\n            <data android:scheme="https"/>\n        </intent>\n    </queries>\n    <application#' "$M"
          fi
          cat "$M"

      - name: Get packages
        run: flutter pub get

      # Quality checks: results are shown in the log but do not block the APK.
      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      # Every build must be signed with the SAME key, otherwise Android refuses
      # to install it as an update (and you'd have to uninstall = lose data).
      # The key is stored as the repository secret DEBUG_KEYSTORE_BASE64.
      - name: Use the permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the repository secret DEBUG_KEYSTORE_BASE64 (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > ~/.android/debug.keystore

      - name: Build APK
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --build-name=1.0.${{ github.run_number }}
          --dart-define=BUILD_NUMBER=${{ github.run_number }}
          --dart-define=UPDATE_REPO=${{ github.repository }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk PennyWise.apk
          # The commit message becomes the "What's new" text in the app.
          git log -1 --pretty=%B > notes.txt
          gh release create "build-${{ github.run_number }}" PennyWise.apk \
            --title "PennyWise 1.0.${{ github.run_number }}" \
            --notes-file notes.txt

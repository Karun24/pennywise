# Builds the PennyWise Android app (APK) on GitHub's free servers and
# publishes it as a Release you can download straight to your phone.
# Runs automatically every time you upload/change files, or manually from
# the Actions tab ("Run workflow").
name: Build PennyWise APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android platform files
        run: |
          flutter create --org com.pennywise --project-name pennywise --platforms android .
          sed -i 's/android:label="[^"]*"/android:label="PennyWise"/' android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      # Quality checks: results are shown in the log but do not block the APK.
      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk PennyWise.apk
          gh release create "build-${{ github.run_number }}" PennyWise.apk \
            --title "PennyWise build ${{ github.run_number }}" \
            --notes "Download PennyWise.apk on your phone and tap it to install."
